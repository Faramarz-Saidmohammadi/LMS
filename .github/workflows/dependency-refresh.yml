name: Dependency Refresh

on:
  push:
    branches:
      - agent/professional-repository-baseline

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-repository-baseline

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh backend lockfile
        working-directory: backend
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Refresh frontend lockfile
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Commit refreshed dependency metadata
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Faramarz Said Mohammadi"
          git config user.email "136171600+Faramarz-Saidmohammadi@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          git commit -m "chore: refresh dependency lockfiles"
          git push origin HEAD:agent/professional-repository-baseline
